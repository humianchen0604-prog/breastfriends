<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Breast Friends Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Noto+Sans+Gurmukhi:wght@500;600;700&display=swap" rel="stylesheet">
<style>
/* PP Pangram Sans: installed copy first, then the private deployment's font files. /fonts is served only behind the site password (middleware.js). */
@font-face{font-family:Pangram;font-weight:500;src:local("PP Pangram Sans Medium"),local("PPPangramSans-Medium"),url("fonts/PPPangramSans-Medium.otf") format("opentype");font-display:swap}
@font-face{font-family:Pangram;font-weight:600;src:local("PP Pangram Sans Semibold"),local("PPPangramSans-Semibold"),url("fonts/PPPangramSans-Semibold.otf") format("opentype");font-display:swap}
@font-face{font-family:Pangram;font-weight:700;src:local("PP Pangram Sans Bold"),local("PPPangramSans-Bold"),url("fonts/PPPangramSans-Bold.otf") format("opentype");font-display:swap}
@font-face{font-family:PangramCompact;font-weight:400;src:local("PP Pangram Sans Compact Regular"),local("PPPangramSans-CompactRegular"),url("fonts/PPPangramSans-CompactRegular.otf") format("opentype");font-display:swap}
:root{
  --sand:#f4f1ec;--pearl:#fff;--nightfall:#1d2567;--ink-slate:#6b6f92;--bar-idle:#c9c3d3;
  --red:#fb4238;--red-soft:#fe6057;--lime:#f0fdb5;--sky:#dceff8;--mist:#c4d5f8;--peri:#9faff8;--cream-card:#eff1b6;
  --ease:cubic-bezier(.32,.72,0,1);
  --pg:Pangram,"Noto Sans Gurmukhi","Gurmukhi MN",Inter,system-ui,sans-serif;
  --in:Inter,"Noto Sans Gurmukhi","Gurmukhi MN",system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:#e6e2da;color:var(--nightfall);font-family:var(--pg);font-weight:500}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:left}
button:focus-visible,input:focus-visible{outline:2px solid var(--peri);outline-offset:2px}
img{display:block}
.static *{animation:none!important;transition:none!important}

/* phone */
.phone{position:relative;width:390px;height:844px;border:1px solid rgba(0,0,0,.2);border-radius:48px;overflow:hidden;background:var(--sand);flex:none}
.frame-only{background:transparent}
.layer{position:absolute;inset:0}
.abs{position:absolute}
.nowrap{white-space:nowrap}
.scroll{position:absolute;left:0;right:0;bottom:0;overflow-y:auto;scrollbar-width:none;overscroll-behavior:contain}
.scroll::-webkit-scrollbar{display:none}
.push{animation:push .34s var(--ease)}
.rise{animation:rise .4s var(--ease)}
@keyframes push{from{transform:translateX(28px);opacity:0}}
@keyframes rise{from{transform:translateY(60px);opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* app header */
.apphead{position:absolute;left:15px;right:15px;top:59px;height:52px;display:flex;align-items:center;justify-content:space-between}
.apphead h1{flex:1;min-width:0;font-size:24px;font-weight:700;white-space:nowrap}
.apphead .acts{display:flex;gap:12px}
.iconbtn{position:relative;width:28px;height:52px;display:flex;align-items:center;justify-content:center;border-radius:26px;transition:transform .16s ease}
.iconbtn::after{content:"";position:absolute;inset:0 -6px}
.iconbtn:active,.press:active{transform:scale(.96)}
.press{transition:transform .16s ease}

/* tab + play bar */
.tabbar{position:absolute;left:50%;transform:translateX(-50%);top:760px;width:200px;height:60px;padding:0 12px;background:var(--pearl);border-radius:999px;display:flex;align-items:center;justify-content:space-between;z-index:5}
.tab{width:44px;height:44px;display:flex;align-items:center;justify-content:center;border-radius:22px}
.tab.on{background:var(--nightfall)}
.playbar{position:absolute;left:15px;top:685px;width:358px;padding:12px;display:flex;align-items:center;justify-content:space-between;background:var(--pearl);border:.5px solid rgba(0,0,0,.1);border-radius:999px;filter:drop-shadow(0 0 10px rgba(0,0,0,.08));z-index:4}
.playbar .info{position:relative;width:222px;height:38px;display:block}
.playbar .av{position:absolute;left:-2px;top:-1px}
.playbar .tt{position:absolute;left:43.5px;top:.5px;width:204px}
.playbar b{display:block;font-size:16px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.playbar small{display:block;margin-top:2px;font:400 14px PangramCompact,var(--pg);color:var(--ink-slate)}
.playbar .ctl{display:flex;gap:8px}

/* avatars */
.av{position:relative;border-radius:999px;overflow:hidden;flex:none}
.av img{position:absolute;max-width:none}

/* home */
.stack{padding:0 15px 180px}
.stack h2{font-size:20px;font-weight:700;text-transform:uppercase;margin-bottom:16px}
.tcard{position:relative;display:block;width:100%;height:100px;margin-bottom:8px;padding:28px 16px;border-radius:24px;overflow:hidden}
.tcard b{display:block;font-size:20px;font-weight:700;letter-spacing:-.2px;text-transform:uppercase;white-space:nowrap}
.tcard span.n{display:block;margin-top:4px;font-size:14px;font-weight:600;letter-spacing:1.96px;white-space:nowrap}
.shape{position:absolute;display:flex;align-items:center;justify-content:center;container-type:size}
.shape i{display:block;flex:none;width:100cqh;height:100cqw;position:relative}
.shape img{width:100%;height:100%}

/* events */
.loc{position:absolute;left:15px;top:113px;display:inline-flex;align-items:center;gap:3px;font-size:16px;font-weight:600;white-space:nowrap}
.day{font-size:16px;font-weight:600;height:30px;white-space:nowrap}
.day em{font-style:normal;opacity:.6;margin-left:5px}
.ev{position:relative;display:block;width:355px;height:251px;border-radius:24px;overflow:hidden}
.ev .ph{position:absolute;left:0;top:0;width:100%;height:153.5px;object-fit:cover;border-radius:16px 16px 0 0}
.ev .ov{position:absolute}
.ev .tx{position:absolute;left:16px;top:166px;right:12px}
.ev .tx b{display:block;font-size:20px;font-weight:700;white-space:nowrap;margin-bottom:8px}
.meta{display:flex;align-items:center;gap:4px;height:16px;font-size:14px;font-weight:500;white-space:nowrap;margin-bottom:4px}
.meta span{opacity:.8}
.badge{position:absolute;left:12px;top:12px;height:32px;padding:0 12px 0 8px;border-radius:999px;background:var(--lime);color:var(--nightfall);font-size:14px;font-weight:600;display:flex;align-items:center;gap:4px;z-index:2}

/* topic */
.bar-head{position:absolute;left:15px;top:60px;width:358px;height:28px;display:flex;align-items:center;gap:4px}
.bar-head b{flex:1;font-size:20px;font-weight:700;white-space:nowrap}
.hero-topic{position:absolute;left:15px;top:108px;width:358px;padding:28px 16px;border-radius:20px;background:var(--red);overflow:hidden;color:var(--sand)}
.hero-topic b{display:block;font:700 24px var(--in);letter-spacing:-.24px;text-transform:uppercase;color:#fff;white-space:nowrap}
.hero-topic span{display:block;margin-top:4px;font:400 15px var(--in);white-space:nowrap}
.row{display:flex;align-items:center;gap:14px;width:100%;padding:12px 14px;background:var(--pearl);border-radius:20px;margin-bottom:10px}
.row .t{flex:1;min-width:0}
.row .t b{display:block;font:700 16px var(--in);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .t span{display:block;margin-top:2px;font:400 14px var(--in);color:var(--ink-slate);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .d{font:400 12px var(--in);color:var(--ink-slate);white-space:nowrap}

/* player */
.ph-head{position:absolute;left:23px;right:23px;top:59px;height:40px;display:flex;align-items:center;justify-content:space-between}
.ph-head .l{width:68px;height:40px;display:flex;align-items:center}
.ph-head .r{display:flex;gap:20px;align-items:center}
.switch{display:flex;align-items:center;gap:4px;padding:8px;border-radius:12px;color:var(--sand);font-size:14px;font-weight:600;white-space:nowrap}
.down{transform:rotate(-90deg)}
.vid{position:absolute;left:23px;top:181px;width:342px;height:280px;border-radius:20px;overflow:hidden}
.vid img{width:100%;height:100%;object-fit:cover}
.vid::after{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.4),transparent 16.2%)}
.vid p{position:absolute;left:12px;right:12px;bottom:14px;text-align:center;color:var(--sand);font-size:16px;font-weight:700;z-index:1}
.ts-card{position:absolute;left:23px;top:115px;width:342px;height:407px;background:var(--sand);border-radius:20px;overflow:hidden}
.ts-card .q{position:absolute;left:256px;top:0;width:88px;height:88px;mix-blend-mode:overlay}
.ts{position:absolute;left:16px;top:24px;width:310px;height:359px;overflow-y:auto;scrollbar-width:none;font-size:24px;font-weight:600;color:rgba(29,37,103,.4)}
.ts::-webkit-scrollbar{display:none}
.ts p{min-height:29px}.ts .on{color:var(--nightfall)}
.ts-card .fade{position:absolute;left:0;top:323px;width:342px;height:84px;background:linear-gradient(to bottom,rgba(244,241,236,0),var(--sand));pointer-events:none}
.pinfo{position:absolute;left:23px;top:542px;color:var(--sand)}
.pinfo h2{font-size:22px;font-weight:700;white-space:nowrap}
.pinfo div{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:14px;white-space:nowrap}
.pinfo b{font-weight:600}.pinfo span{color:rgba(244,241,236,.6)}
.track{position:absolute;left:23px;top:629px;width:342px;height:48px;padding:0 12px 8px;display:flex;align-items:flex-end;justify-content:space-between;background:rgba(244,241,236,.1);border-radius:16px;overflow:hidden}
.track i{display:block;width:4px;border-radius:2px;background:rgba(244,241,236,.28)}
.track i.p{background:var(--lime)}
.track u{position:absolute;left:17px;top:4px;bottom:4px;width:2px;border-radius:1px;background:var(--lime)}
.times{position:absolute;left:23px;top:685px;width:342px;padding:0 4px;display:flex;justify-content:space-between;font:600 13px var(--in);color:rgba(244,241,236,.4)}
.ctrl{position:absolute;left:0;right:0;top:721px;display:flex;justify-content:center;gap:40px}

/* search */
.field{position:absolute;left:15px;top:123px;width:358px;height:52px;padding:0 14px;display:flex;align-items:center;gap:10px;background:var(--pearl);border-radius:999px;border:1.5px solid transparent;transition:border-color .16s ease}
.field:focus-within{border-color:var(--nightfall)}
.field input{flex:1;min-width:0;height:100%;border:0;outline:0;background:none;font:600 16px var(--pg);color:var(--nightfall)}
.field input::placeholder{color:var(--ink-slate);font-weight:500}
.sec{font-size:16px;line-height:20px;font-weight:600;margin:0 0 10px;white-space:nowrap}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{height:40px;padding:0 16px;display:inline-flex;align-items:center;background:var(--pearl);border-radius:999px;font-size:14px;font-weight:600;white-space:nowrap}
.chip.on{background:var(--nightfall);color:var(--sand)}
.fchips{position:absolute;left:0;right:0;top:187px;display:flex;gap:8px;padding:0 15px;overflow-x:auto;scrollbar-width:none}
.fchips::-webkit-scrollbar{display:none}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px 8px}
.tile{position:relative;height:96px;padding:18px 14px;border-radius:24px;overflow:hidden;display:block}
.tile b{display:block;position:relative;z-index:1;font-size:15px;font-weight:700;text-transform:uppercase;line-height:1.15;letter-spacing:-.15px}
.tile .c{display:block;position:relative;z-index:1;margin-top:4px;font-size:12px;font-weight:600;letter-spacing:1.4px}
mark{background:var(--lime);color:var(--nightfall);border-radius:4px;padding:0 2px}
.res-t{display:flex;align-items:center;gap:12px;width:100%;padding:14px 16px;border-radius:20px;margin-bottom:8px}
.res-t b{display:block;font-size:18px;line-height:23px;font-weight:700;white-space:nowrap}
.res-t span{display:block;font-size:14px;line-height:18px;font-weight:500;opacity:.8}
.res-t span span{margin-top:2px}
.quote{display:block;width:100%;padding:14px;background:var(--pearl);border-radius:20px;margin-bottom:10px}
.quote p{font-size:16px;font-weight:600;line-height:1.3}
.quote div{display:flex;align-items:center;gap:8px;margin-top:10px;font:400 13px var(--in);color:var(--ink-slate)}
.thumb{width:52px;height:52px;border-radius:16px;object-fit:cover;flex:none}
.empty{position:absolute;left:16px;right:16px;top:232px;text-align:center}
.empty h2{font-size:22px;font-weight:700;margin:0 0 8px;line-height:28px}
.empty p{font-size:15px;color:var(--ink-slate);line-height:19px;margin-bottom:28px}
.empty .chips{justify-content:center}

/* sheets */
.scrim{position:absolute;inset:-1px;background:rgba(0,0,0,.6);z-index:10;animation:fade .28s ease}
@keyframes fade{from{opacity:0}}
.sheet{position:absolute;left:-1px;width:390px;bottom:-1px;background:var(--sand);border-radius:24px 24px 0 0;z-index:11;animation:up .42s var(--ease);padding-bottom:40px;display:flex;flex-direction:column}
.sheet.closing{transform:translateY(105%);transition:transform .26s ease-in}
@keyframes up{from{transform:translateY(100%)}}
.grab{height:50px;flex:none;position:relative;cursor:grab;touch-action:none}
.grab::after{content:"";position:absolute;left:175px;top:12px;width:40px;height:6px;border-radius:999px;background:#000;opacity:.2}
.sheet h2{padding:0 23px;font-size:22px;font-weight:700;white-space:nowrap}
.sheet .sub{padding:4px 23px 0;font-size:15px;color:var(--ink-slate);line-height:1.35}
.sheet .body{padding:16px 16px 0}
.sheet .inner-scroll{overflow-y:auto;scrollbar-width:none;touch-action:pan-y}
.sheet .inner-scroll::-webkit-scrollbar{display:none}
.tick{width:24px;height:24px;border-radius:50%;border:2px solid var(--bar-idle);flex:none}
.tick.on{border:0;background:var(--nightfall);display:flex;align-items:center;justify-content:center}
.lang-av{width:52px;height:52px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:700;flex:none}
.seg{display:flex;height:44px;padding:4px;background:var(--pearl);border-radius:999px;margin-bottom:12px}
.seg button{flex:1;border-radius:999px;text-align:center;font-size:14px;font-weight:600;transition:background .18s ease,color .18s ease}
.seg .on{background:var(--nightfall);color:var(--sand)}
.card-share{position:relative;min-height:172px;padding:20px;background:var(--red);color:var(--sand);border-radius:20px;overflow:hidden;display:flex;flex-direction:column}
.card-share .mini{margin-top:auto}
.card-share .q{position:absolute;right:-28px;top:-20px;width:146px;height:146px;opacity:.5}
.who{position:relative;display:flex;align-items:center;gap:8px;font-size:14px;white-space:nowrap}
.who b{font-weight:600}.who span{opacity:.75}
.card-share h3{position:relative;margin:14px 0 16px;font-size:24px;font-weight:700;line-height:1.14}
.mini{position:relative;display:flex;align-items:center;gap:10px;font:600 13px var(--in)}
.mini div{display:flex;align-items:flex-end;gap:3px;height:24px}
.mini i{display:block;width:3px;border-radius:2px;background:var(--lime)}
.mini i.off{background:rgba(244,241,236,.32)}
.chan{display:flex;gap:8px;margin:20px -16px 0;padding:0 16px;overflow-x:auto;scrollbar-width:none;cursor:grab}
.chan::-webkit-scrollbar{display:none}
.chan button{flex:none;width:72px;text-align:center;font-size:13px;font-weight:500;white-space:nowrap}
.chan span{display:flex;align-items:center;justify-content:center;width:64px;height:64px;margin:0 auto 8px;border-radius:50%;overflow:hidden;background:var(--pearl);transition:transform .16s ease}
.chan img{display:block;width:64px;height:64px;pointer-events:none}
.chan button:active span{transform:scale(.94)}
.cta{display:flex;width:100%;height:56px;align-items:center;justify-content:center;gap:8px;background:var(--nightfall);color:var(--sand);border-radius:999px;font-size:16px;font-weight:700;white-space:nowrap}
.cta.lime{background:var(--lime);color:var(--nightfall)}
.cta.white{background:var(--pearl);color:var(--nightfall)}
.step{display:flex;align-items:center;gap:6px}
.step button{width:44px;height:44px;border-radius:50%;background:var(--sand);text-align:center;font-size:22px;font-weight:600}
.step button:disabled{cursor:default}
.step b{width:28px;text-align:center;font-size:18px;font-weight:700}
.panel{background:var(--pearl);border-radius:20px;padding:16px;margin-bottom:10px}
.panel h3{font-size:18px;font-weight:700;margin-bottom:8px}
.panel p{font-size:15px;line-height:1.4;color:var(--ink-slate)}
.li{display:flex;gap:10px;align-items:flex-start;font-size:15px;color:var(--nightfall);line-height:1.3;margin-top:10px}
.li:first-of-type{margin-top:0}
.li svg{flex:none;margin-top:1px}
.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}
.facts div{padding:14px 12px 16px;border-radius:20px;background:var(--pearl)}
.facts img{display:block;margin-bottom:14px}
.facts b{display:block;font-size:18px;line-height:23px;font-weight:700;white-space:nowrap}
.facts span{display:block;margin-top:2px;font-size:13px;line-height:16px;color:var(--ink-slate);white-space:nowrap}
.cta-bar{position:absolute;left:0;right:0;bottom:0;height:128px;padding:44px 16px 0;background:linear-gradient(to bottom,rgba(244,241,236,0),var(--sand) 34%);z-index:4}
.toast{position:absolute;left:50%;top:62px;transform:translateX(-50%);height:44px;padding:0 18px;display:flex;align-items:center;gap:8px;background:var(--nightfall);color:var(--sand);border-radius:999px;font-size:14px;font-weight:600;white-space:nowrap;z-index:30;animation:toast .32s var(--ease)}
@keyframes toast{from{transform:translate(-50%,-24px);opacity:0}}

/* review shell */
.shell{min-height:100%;padding:20px 28px 56px}
.topbar{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px 16px;margin-bottom:24px}
.tools{display:flex;flex-wrap:wrap;gap:8px}
.topbar h1{font-size:20px;font-weight:700}
.view{display:flex;padding:3px;border-radius:999px;background:#d8d3c9}
.view button{height:34px;padding:0 14px;white-space:nowrap;border-radius:999px;font-size:14px;font-weight:600}
.view .on{background:var(--pearl)}
.group{margin-bottom:36px}
.group>h2{font-size:16px;font-weight:700;margin-bottom:14px}
.group>h2 span{font-weight:500;color:var(--ink-slate);margin-left:8px}
.board{display:flex;flex-wrap:wrap;gap:24px}
.fr{position:relative;width:234px;display:block}
.fr .cap{display:block;margin-bottom:8px;font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fr .box{display:block;position:relative;width:234px;height:507px;border-radius:29px;overflow:hidden}
.fr iframe{width:390px;height:844px;border:0;transform:scale(.6);transform-origin:0 0;pointer-events:none;background:transparent}
.fr:hover .box{box-shadow:0 0 0 2px var(--nightfall)}
.proto{display:grid;grid-template-columns:210px minmax(0,1fr);gap:32px;align-items:start}
.proto .stage{justify-self:center}
.rail{width:210px;flex:none}
.rail h2{font-size:13px;font-weight:700;margin:0 0 6px;color:var(--ink-slate)}
.rail ul{list-style:none;padding:0;margin:0 0 18px -10px}
.rail button{display:block;width:100%;padding:7px 10px;border-radius:10px;font-size:14px;font-weight:600}
.rail button:hover{background:#dcd7cd}
.rail .on{background:var(--nightfall);color:var(--sand)}
.stage{flex:none}
/* phone bezel, Clickable view only */
.stage{padding:0 4px}
.device{position:relative;width:418px;height:876px;padding:5px;border-radius:72px;background:linear-gradient(145deg,#ded4e8,#b9a9ca 22%,#e6deee 50%,#b3a3c5 78%,#d6cbe1);box-shadow:inset 0 0 0 1px rgba(255,255,255,.6),inset 0 0 0 2px rgba(120,100,145,.25)}
.bez{position:relative;width:408px;height:866px;padding:9px;border-radius:67px;background:#000}
.device .phone{border:0;height:848px;border-radius:58px}
.device .sheet{left:0}
.island{position:absolute;left:50%;top:23px;width:120px;height:35px;margin-left:-60px;border-radius:18px;background:#000;z-index:40;pointer-events:none}
.island::after{content:"";position:absolute;right:10px;top:11px;width:13px;height:13px;border-radius:50%;background:radial-gradient(circle at 50% 50%,#2b2f7a 0,#14143c 45%,#050509 75%)}
.hw{position:absolute;width:3px;background:linear-gradient(to bottom,#cdbfda,#a897bb 50%,#cdbfda)}
.hw.l{left:-3px;border-radius:2px 0 0 2px}
.hw.r{right:-3px;border-radius:0 2px 2px 0}
@media (max-width:760px){.proto{display:flex;justify-content:center}.shell{padding:16px}.rail{display:none}.fr{width:calc(50% - 12px)}.board{gap:16px 12px}.fr .box{width:100%}}
</style>
</head>
<body>
<div id="root"></div>
<script>

 ${show('events')?`${f==='all'?`<h2 class="sec">${t('fEvents')}</h2>`:''}${R.events.map(e=>`<button class="row press" data-a="event:${e.id}"><img class="thumb" src="assets/${e.img}" alt=""><span class="t"><b>${mark(L(e.title),q)}</b><span>${t(e.day)} · ${e.time}</span></span></button>`).join('')}`:''}
 </div>`}
const norm=s=>[...String(s)].map(c=>(c.normalize('NFD')[0]||c).toLowerCase()).join('');
function mark(text,q){const i=norm(text).indexOf(norm(q));if(i<0)return esc(text);return esc(text.slice(0,i))+'<mark>'+esc(text.slice(i,i+q.length))+'</mark>'+esc(text.slice(i+q.length))}
function find(q){const n=norm(q),has=s=>norm(s).includes(n);
 return{topics:TOPICS.filter(x=>has(t(x.id))||has(x.kw)),
 stories:PEOPLE.filter(p=>has(L(p.title))||has(p.name)||has(L(p.role))),
 moments:(TRANSCRIPT[S.lang]||TRANSCRIPT.en).filter(([l])=>l&&has(l.replace('|',''))).slice(0,3).map(([l,ts])=>({text:l.replace('|',''),ts})),
 events:EVENTS.filter(e=>has(L(e.title))||has(t('center')))}}

/* ---------- sheets ---------- */
const SH={
language(){const rows=[['en','En','English','#f0fdb5'],['es','Es','Español','#9faff8'],['pa','ਪੰ','ਪੰਜਾਬੀ','#dceff8']];
 return `<h2>${t('language')}</h2><p class="sub">${t('langSub')}</p><div class="body">
 ${rows.map(([k,g,n,c])=>`<button class="row press" data-a="lang:${k}" role="radio" aria-checked="${S.lang===k}"><span class="lang-av" style="background:${c}">${g}</span><span class="t"><b>${n}</b></span><span class="tick ${S.lang===k?'on':''}">${S.lang===k?check():''}</span></button>`).join('')}</div>`},

share(){const c=S.share;
 const LINK='<svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#1d2567" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/></svg>';
 const chans=[['copy',null],['wa','brand-whatsapp-circle.svg'],['fb','brand-facebook-circle.svg'],['msg','brand-message-circle.svg'],['ig','brand-instagram-circle.svg']];
 let preview;
 if(c.kind==='event'){const e=ev();preview=eventCard(e,'div',true).replace('style="','style="width:358px;')}
 else{const p=PEOPLE[c.p||0],mo=c.seg==='moment'&&(c.p||0)===0;
  preview=`<div class="card-share"><img class="q" src="assets/shape-topic.svg" alt=""><div class="who">${av(p,24)}<b>${p.name}</b><span>· ${L(p.role)}</span></div><h3>${mo?`“${t('caption')}”`:L(p.title)}</h3><div class="mini"><div>${BARS.slice(14,38).map((h,i)=>`<i class="${mo&&(i<6||i>13)?'off':''}" style="height:${Math.max(4,Math.round(h*.7))}px"></i>`).join('')}</div><span>${mo?'0:12–0:18':p.dur}</span></div></div>`}
 return `<h2>${t(c.kind==='event'?'shareEvent':'shareTitle')}</h2><div class="body">
 ${c.kind==='story'&&(c.p||0)===0?`<div class="seg" role="tablist"><button class="${c.seg==='whole'?'on':''}" data-a="seg:whole" role="tab" aria-selected="${c.seg==='whole'}">${t('whole')}</button><button class="${c.seg==='moment'?'on':''}" data-a="seg:moment" role="tab" aria-selected="${c.seg==='moment'}">${t('moment')}</button></div>`:''}
 ${preview}
 <div class="chan">${chans.map(([k,src])=>`<button data-a="send:${k}"><span>${src?`<img src="assets/${src}" alt="">`:(c.copied?check('#1d2567',24):LINK)}</span>${k==='copy'&&c.copied?t('copied'):t(k)}</button>`).join('')}</div>
 </div>`},

rsvp(){const e=ev();
 if(S.going[e.id])return `<h2>${t('inT')}</h2><div class="body"><div class="hero-topic" style="position:relative;left:0;top:0;width:100%;background:${e.bg};color:${e.ink}"><img class="abs" src="assets/shape-topic.svg" alt="" style="left:246px;top:-19px;width:146px;height:146px;${e.bg==='#fb4238'?'':'opacity:.4'}"><span style="position:relative;font:700 20px var(--pg);margin:0;white-space:normal;padding-right:70px">${L(e.title)}</span><span style="position:relative;font:500 15px/1.35 var(--pg);margin-top:8px;white-space:normal;padding-right:60px">${t('inB',`${t(e.day)}, ${t(e.dow)}`,e.time)}</span></div>
 <div style="display:flex;gap:8px;margin-top:16px"><button class="cta white press" data-a="toast:calAdded">${t('addCal')}</button><button class="cta press" data-a="close">${t('done')}</button></div></div>`;
 return `<h2>${t('rsvp')}</h2><div class="body">
 <div class="row" style="margin-bottom:10px"><img class="thumb" src="assets/${e.img}" alt=""><span class="t"><b>${L(e.title)}</b><span>${t(e.day)} · ${e.time}</span></span></div>
 <div class="row" style="margin-bottom:10px"><span class="t"><b>${t('howMany')}</b><span>${t('inclYou')}</span></span><span class="step"><button data-a="g:-1" aria-label="−" ${S.guests<2?'disabled':''}>−</button><b aria-live="polite">${S.guests}</b><button data-a="g:1" aria-label="+" ${S.guests>3?'disabled':''}>+</button></span></div>
 <div class="panel"><h3 style="font:700 16px var(--in);margin-bottom:12px">${t('interp')}</h3><div class="chips">${[['none',t('none')],['es','Español'],['pa','ਪੰਜਾਬੀ']].map(([k,l])=>`<button class="chip ${S.interp===k?'on':''}" style="${S.interp===k?'':'background:var(--sand)'}" data-a="i:${k}">${l}</button>`).join('')}</div></div>
 <button class="cta press" data-a="confirm" style="margin-top:6px">${t('confirm')}</button></div>`},

location(){return `<h2>${t('locT')}</h2><div class="body">
 ${CITIES.map(c=>`<button class="row press" style="padding:16px 14px" data-a="city:${c}" role="radio" aria-checked="${S.city===c}"><span class="t"><b>${c}</b></span><span class="tick ${S.city===c?'on':''}">${S.city===c?check():''}</span></button>`).join('')}
 <div class="panel"><h3 style="font:700 16px var(--in);margin-bottom:12px">${t('radius')}</h3><div class="chips">${[10,25,40].map(m=>`<button class="chip ${S.miles===m?'on':''}" style="${S.miles===m?'':'background:var(--sand)'}" data-a="mi:${m}">${m} ${t('miles')}</button>`).join('')}</div></div>
 <button class="cta press" data-a="close" style="margin-top:6px">${t('show')}</button></div>`},

playlist(){const gs=[['hurt','#fb4238','#f4f1ec','shape-36','hurt',6,'ic-chev-cream-24','ic-kebab-cream'],['cost','#9faff8','#1d2567','shape-peri-36','costQ',4,'ic-chev-navy-24','ic-kebab-navy'],['cost2','#1d2567','#f4f1ec','shape-navy-36','costQ',4,'ic-chev-cream-24','ic-kebab-cream']];
 return `<h2 style="position:absolute;top:50px">${t('playlist')}</h2><div class="inner-scroll" style="margin-top:41px;height:703px;padding:0 16px 48px">
 ${gs.map(([id,bg,ink,sh,key,n,chev,keb])=>{const op=S.open===id;return `<section style="background:${bg};color:${ink};border-radius:20px;padding:20px 20px ${op?24:20}px;margin-bottom:12px">
  <button data-a="open:${id}" aria-expanded="${op}" style="display:flex;width:100%;height:52px;align-items:center;justify-content:space-between"><span style="display:flex;gap:12px;align-items:center"><img src="assets/${sh}.svg" alt="" height="36" style="width:auto"><span><b style="display:block;font-size:20px;font-weight:700;white-space:nowrap">${t(key)}</b><span style="display:block;font-size:16px;opacity:.85">${t('clips',n)}</span></span></span><img src="assets/${chev}.svg" width="24" height="24" alt="" style="transform:rotate(${op?90:-90}deg);transition:transform .22s ease"></button>
  ${op?`<div style="margin-top:20px">${PEOPLE.slice(0,n).map((p,i)=>`<div style="display:flex;align-items:center;justify-content:space-between;${i?'margin-top:24px':''}"><button data-a="pl:${id}:${i}" style="display:flex;gap:8px;align-items:center;min-width:0">${av(p,36)}<span style="min-width:0"><b style="display:block;font-size:16px;font-weight:600;white-space:nowrap">${p.name}</b><span style="display:block;font-size:14px;opacity:.8;white-space:nowrap">${L(p.role)}</span></span></button><span style="display:flex;gap:8px;flex:none"><button data-a="pl:${id}:${i}" aria-label="${t('play')}">${img(`btn-${S.cur===i&&id==='hurt'?'pause':'play'}-24-${id}.svg`,24)}</button><button data-a="share:${i}" aria-label="${t('share')}">${img(keb+'.svg',24)}</button></span></div>`).join('')}</div>`:''}</section>`}).join('')}</div>`}
};

/* ---------- render ---------- */
let app,toastT;
function render(anim){const scr=app.querySelector('.scroll');const keep=scr?scr.scrollTop:0;
 document.documentElement.lang=S.lang;
 app.style.background=S.s==='player'?'#fb4238':'var(--sand)';
 app.querySelector('#scr').className='layer '+(anim||'');
 app.querySelector('#scr').innerHTML=V[S.s]();
 if(!anim){const n=app.querySelector('.scroll');if(n)n.scrollTop=keep}
 renderSheet()}
function renderSheet(enter){const h=app.querySelector('#sh');if(!S.sheet){h.innerHTML='';return}
 const was=h.querySelector('.sheet');const inner=was&&was.querySelector('.inner-scroll');const keep=inner?inner.scrollTop:0;
 h.innerHTML=`<div class="scrim" data-a="close" style="${enter?'':'animation:none'}"></div><div class="sheet" role="dialog" aria-modal="true" style="${enter?'':'animation:none'}${S.sheet==='playlist'?';top:99px;padding-bottom:0':''}"><div class="grab"></div>${SH[S.sheet]()}</div>`;
 const n=h.querySelector('.inner-scroll');if(n)n.scrollTop=keep;bindDrag(h.querySelector('.sheet'));bindChan(h.querySelector('.sheet'))}
function bindChan(sheet){const r=sheet.querySelector('.chan');if(!r)return;let x0=null,sl=0,moved=false;
 r.onpointerdown=e=>{if(e.pointerType!=='mouse')return;x0=e.clientX;sl=r.scrollLeft;moved=false};
 r.onpointermove=e=>{if(x0==null)return;const d=e.clientX-x0;if(Math.abs(d)>4)moved=true;r.scrollLeft=sl-d};
 r.onpointerup=r.onpointerleave=()=>{x0=null};
 r.addEventListener('click',e=>{if(moved){e.stopPropagation();e.preventDefault();moved=false}},true)}
function toast(msg){const old=app.querySelector('.toast');if(old)old.remove();const d=document.createElement('div');d.className='toast';d.setAttribute('role','status');d.innerHTML=check('#f0fdb5')+esc(msg);app.appendChild(d);clearTimeout(toastT);toastT=setTimeout(()=>d.remove(),1900)}
function openSheet(n){S.sheet=n;renderSheet(true)}
function closeSheet(){const sh=app.querySelector('.sheet');if(!sh){S.sheet=null;return}S.sheet=null;sh.classList.add('closing');sh.style.transform='';const scrim=app.querySelector('.scrim');if(scrim){scrim.style.transition='opacity .26s';scrim.style.opacity=0}setTimeout(()=>{if(!S.sheet)app.querySelector('#sh').innerHTML=''},260)}
function bindDrag(sh){const g=sh.querySelector('.grab');let y0=null,dy=0;
 g.onpointerdown=e=>{y0=e.clientY;dy=0;g.setPointerCapture(e.pointerId);sh.style.transition='none'};
 g.onpointermove=e=>{if(y0==null)return;dy=Math.max(0,e.clientY-y0);sh.style.transform=`translateY(${dy}px)`};
 g.onpointerup=()=>{if(y0==null)return;y0=null;sh.style.transition='transform .3s var(--ease)';if(dy>80){closeSheet()}else sh.style.transform=''}}
function go(s,extra,anim='push'){hist.push({s:S.s,mode:S.mode,ev:S.ev});S.s=s;Object.assign(S,extra||{});S.sheet=null;render(anim);syncRail()}

const ACT={
 'nav':v=>{hist=[];S.s=v;S.sheet=null;render();syncRail()},
 back(){const p=hist.pop()||{s:'home'};Object.assign(S,p);render();syncRail()},
 close:closeSheet,
 sheet:v=>openSheet(v),
 topic:v=>go('topic',{topic:v||'hurt'}),
 player:()=>go('player',{mode:'video'},'rise'),
 audio:()=>go('player',{mode:'audio'},'rise'),
 mode(){S.mode=S.mode==='video'?'audio':'video';render()},
 toggle(){S.playing=!S.playing;render()},
 event:v=>go('workshop',{ev:v}),
 share(v){S.share=v==='event'?{kind:'event'}:{kind:'story',p:+v,seg:'whole'};openSheet('share')},
 seg(v){S.share.seg=v;renderSheet()},
 send(v){if(v==='copy'){S.share.copied=true;navigator.clipboard?.writeText('https://example.com/breast-friends/maya-bennett').catch(()=>{});renderSheet();toast(t('linkCopied'));return}
  const name=t(v);closeSheet();toast(t('opening',name))},
 lang(v){S.lang=v;G=v;syncLang();render();setTimeout(()=>{closeSheet();toast(STR[v].changed)},140)},
 q(v){S.q=v;S.filter='all';const i=app.querySelector('#q');if(i)i.value=v;paintSearch()},
 clearq(){ACT.q('');app.querySelector('#q').focus()},
 filter(v){S.filter=v;paintSearch()},
 g(v){S.guests=Math.min(4,Math.max(1,S.guests+ +v));renderSheet()},
 i(v){S.interp=v;renderSheet()},
 confirm(){S.going[S.ev]=1;render()},
 toast:v=>toast(t(v)),
 city(v){S.city=v;render()},
 mi(v){S.miles=+v;render()},
 open(v){S.open=S.open===v?null:v;renderSheet()},
 pl(v){const[id,i]=v.split(':');if(id==='hurt')S.cur=+i;renderSheet()}
};
function paintSearch(){const scr=app.querySelector('#sr');if(!scr)return;scr.innerHTML=searchBody();const x=app.querySelector('#qx');if(x)x.style.display=S.q?'block':'none'}

function mount(el){el.innerHTML='<div class="phone" id="app"><div id="scr" class="layer"></div><div id="sh"></div></div>';app=el.querySelector('#app');
 app.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b)return;const raw=b.dataset.a,i=raw.indexOf(':');const k=i<0?raw:raw.slice(0,i),v=i<0?undefined:raw.slice(i+1);ACT[k]&&ACT[k](v)});
 app.addEventListener('input',e=>{if(e.target.id==='q'){S.q=e.target.value;S.filter='all';paintSearch()}})}
function load(id){S=fresh({lang:G,...PRESETS[id]});if(id==='results')S.q=t('tryA');hist=S.s==='home'||S.s==='events'||S.s==='search'?[]:[{s:S.s==='workshop'?'events':'home',mode:'video',ev:S.ev}];render();if(S.scroll!=null){const n=app.querySelector('.scroll');if(n)n.scrollTop=S.scroll}syncRail(id)}
addEventListener('keydown',e=>{if(e.key==='Escape'&&S&&S.sheet)closeSheet()});

/* ---------- review shell ---------- */
let current='home',view='board';
function syncLang(){document.querySelectorAll('[data-l]').forEach(b=>b.classList.toggle('on',b.dataset.l===G))}
function syncRail(id){if(id)current=id;document.querySelectorAll('.rail button').forEach(b=>b.classList.toggle('on',b.dataset.f===current&&!!id))}
function shell(){const root=document.getElementById('root');
 root.innerHTML=`<div class="shell"><div class="topbar"><h1>Breast Friends</h1><div class="tools"><div class="view" aria-label="Language">${[['en','English'],['es','Español'],['pa','ਪੰਜਾਬੀ']].map(([k,l])=>`<button data-l="${k}" class="${G===k?'on':''}">${l}</button>`).join('')}</div><div class="view"><button data-v="board" class="${view==='board'?'on':''}">All screens</button><button data-v="proto" class="${view==='proto'?'on':''}">Clickable</button></div></div></div><div id="v"></div></div>`;
 root.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>{view=b.dataset.v;shell()});
 root.querySelectorAll('[data-l]').forEach(b=>b.onclick=()=>{G=b.dataset.l;if(view==='proto'){S.lang=G;if(S.s==='search'&&current==='results')S.q=t('tryA');syncLang();render()}else shell()});
 const v=root.querySelector('#v');
 if(view==='board'){v.innerHTML=GROUPS.map(([g,n,items])=>`<section class="group"><h2>${g}<span>${n}</span></h2><div class="board">${items.map(([id,c])=>`<button class="fr" data-f="${id}"><span class="cap">${c}</span><span class="box"><iframe loading="lazy" tabindex="-1" title="${c}" src="?frame=${id}&lang=${G}"></iframe></span></button>`).join('')}</div></section>`).join('');
  v.querySelectorAll('.fr').forEach(b=>b.onclick=()=>{view='proto';current=b.dataset.f;shell();scrollTo(0,0)});return}
 v.innerHTML=`<div class="proto"><aside class="rail">${GROUPS.map(([g,,items])=>`<h2>${g}</h2><ul>${items.map(([id,c])=>`<li><button data-f="${id}">${c}</button></li>`).join('')}</ul>`).join('')}</aside><div class="stage" id="st"><div class="device"><i class="hw l" style="top:180px;height:38px"></i><i class="hw l" style="top:250px;height:64px"></i><i class="hw l" style="top:332px;height:64px"></i><i class="hw r" style="top:272px;height:103px"></i><div class="bez"><div id="mp"></div><div class="island"></div></div></div></div></div>`;
 const st=v.querySelector('#st');mount(v.querySelector('#mp'));
 const fit=()=>{const z=Math.min(1,(innerHeight-90)/880);st.style.zoom=z};fit();addEventListener('resize',fit);
 v.querySelectorAll('.rail button').forEach(b=>b.onclick=()=>load(b.dataset.f));load(current)}

if(frameId&&PRESETS[frameId]){document.body.classList.add('static','frame-only');document.body.style.background='transparent';mount(document.getElementById('root'));load(frameId)}
else shell();
</script>
<script src="progress.js"></script>
</body>
